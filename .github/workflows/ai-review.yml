name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Номер pull request для ревью"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout assistant (vitchuk/ai-challenge-roof)
        uses: actions/checkout@v4
        with:
          repository: vitchuk/ai-challenge-roof
          ref: day32
          path: assistant

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          cd target
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid -q .baseRefOid)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          git fetch origin "pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" --force || true
          git fetch origin "$BASE_SHA" --force || true
          git fetch origin "$HEAD_SHA" --force || true
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title > /tmp/pr_title.txt
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/pr_body.txt
          {
            echo "base=$BASE_SHA"
            echo "head=$HEAD_SHA"
            echo "pr=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "httpx>=0.28" "openai>=1.60" "python-dotenv>=1.0"

      - name: Pull embedding model into Ollama
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:11434/api/tags >/dev/null
          curl -sf http://localhost:11434/api/pull -d '{"name":"qwen3-embedding:0.6b","stream":false}' >/dev/null

      - name: Cache RAG index
        uses: actions/cache@v4
        with:
          path: assistant/server/data/rag/fixed/index.json
          key: rag-pr-${{ steps.ctx.outputs.base }}-v1

      - name: Run AI review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          set -euo pipefail
          python assistant/server/scripts/pr_review.py \
            --repo-dir target \
            --base "${{ steps.ctx.outputs.base }}" \
            --head "${{ steps.ctx.outputs.head }}" \
            --pr-number "${{ steps.ctx.outputs.pr }}" \
            --repo "${{ github.repository }}" \
            --title "$(cat /tmp/pr_title.txt)" \
            --body "$(cat /tmp/pr_body.txt)" \
            --index-dir "$GITHUB_WORKSPACE/assistant/server/data/rag/fixed"
